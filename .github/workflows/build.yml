name: Build TapestryLogin.exe

on:
  push:
    paths:
      - 'TapestryLogin.ahk'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with AutoHotkey v1.1
        uses: nukdokplex/autohotkey-build@v0.4
        with:
          version: v1.1.37.02
          x64: true
          x86: false
          compression: none
          in: TapestryLogin.ahk
          out: build

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: TapestryLogin-exe
          path: build/**
