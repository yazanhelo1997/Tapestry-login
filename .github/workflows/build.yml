name: Build TapestryLogin.exe

on:
  push:
    paths:
      - 'TapestryLogin.ahk'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        run: choco install autohotkey -y --no-progress

      - name: Compile script to exe
        shell: pwsh
        run: |
          $ahk2exe = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          & $ahk2exe /in "TapestryLogin.ahk" /out "TapestryLogin.exe"
          if (!(Test-Path "TapestryLogin.exe")) {
            throw "Compilation failed: TapestryLogin.exe was not created"
          }

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: TapestryLogin-exe
          path: TapestryLogin.exe
