name: Build TapestryLogin.exe

on:
  push:
    paths:
      - 'TapestryLogin.ahk'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        run: choco install autohotkey -y --no-progress

      - name: Locate Ahk2Exe.exe
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "C:\" -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$found) {
            throw "Could not find Ahk2Exe.exe anywhere on C:\ after installing AutoHotkey"
          }
          Write-Host "Found at: $($found.FullName)"
          echo "AHK2EXE_PATH=$($found.FullName)" >> $env:GITHUB_ENV

      - name: Compile script to exe
        shell: pwsh
        run: |
          & "$env:AHK2EXE_PATH" /in "TapestryLogin.ahk" /out "TapestryLogin.exe"
          if (!(Test-Path "TapestryLogin.exe")) {
            throw "Compilation failed: TapestryLogin.exe was not created"
          }

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: TapestryLogin-exe
          path: TapestryLogin.exe
