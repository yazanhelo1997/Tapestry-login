name: Build TapestryLogin.exe

on:
  push:
    paths:
      - 'TapestryLogin.ahk'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and silently install AutoHotkey (v1.1)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/ahk-install.exe" -OutFile "ahk-install.exe"
          Start-Process -FilePath ".\ahk-install.exe" -ArgumentList "/S" -Wait

      - name: Locate Ahk2Exe.exe
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe",
            "C:\Program Files (x86)\AutoHotkey\Compiler\Ahk2Exe.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$found) {
            $found = Get-ChildItem -Path "C:\" -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$found) {
            throw "Could not find Ahk2Exe.exe after installing AutoHotkey"
          }
          Write-Host "Found at: $found"
          echo "AHK2EXE_PATH=$found" >> $env:GITHUB_ENV

      - name: Compile script to exe
        shell: pwsh
        run: |
          & "$env:AHK2EXE_PATH" /in "TapestryLogin.ahk" /out "TapestryLogin.exe"
          if (!(Test-Path "TapestryLogin.exe")) {
            throw "Compilation failed: TapestryLogin.exe was not created"
          }

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: TapestryLogin-exe
          path: TapestryLogin.exe