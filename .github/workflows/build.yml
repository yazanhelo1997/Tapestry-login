name: Build TapestryLogin.exe

on:
  push:
    paths:
      - 'TapestryLogin.ahk'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and silently install AutoHotkey (v1.1) via GitHub Releases
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "github-actions" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases" -Headers $headers
          $v1release = $releases | Where-Object { $_.tag_name -match '^v1\.' } | Select-Object -First 1
          if (!$v1release) {
            throw "Could not find a v1.x AutoHotkey release"
          }
          $asset = $v1release.assets | Where-Object { $_.name -like "*setup.exe" } | Select-Object -First 1
          if (!$asset) {
            throw "Could not find a setup.exe asset in release $($v1release.tag_name)"
          }
          Write-Host "Downloading $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile "ahk-install.exe"
          Start-Process -FilePath ".\ahk-install.exe" -ArgumentList "/S" -Wait

      - name: Locate Ahk2Exe.exe
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe",
            "C:\Program Files (x86)\AutoHotkey\Compiler\Ahk2Exe.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$found) {
            $found = Get-ChildItem -Path "C:\" -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$found) {
            throw "Could not find Ahk2Exe.exe after installing AutoHotkey"
          }
          Write-Host "Found at: $found"
          echo "AHK2EXE_PATH=$found" >> $env:GITHUB_ENV

      - name: Compile script to exe
        shell: pwsh
        run: |
          & "$env:AHK2EXE_PATH" /in "TapestryLogin.ahk" /out "TapestryLogin.exe"
          $exitCode = $LASTEXITCODE
          Start-Sleep -Seconds 2
          if (Test-Path "TapestryLogin.exe") {
            Write-Host "TapestryLogin.exe confirmed on disk."
          } elseif ($exitCode -ne 0) {
            throw "Ahk2Exe exited with code $exitCode and no exe was found"
          } else {
            Write-Host "Warning: exe not found at expected relative path, but Ahk2Exe reported success. Searching..."
            $found = Get-ChildItem -Path "${{ github.workspace }}" -Filter "TapestryLogin.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$found) {
              throw "Ahk2Exe reported success but TapestryLogin.exe cannot be located anywhere in the workspace"
            }
            Copy-Item $found.FullName -Destination "TapestryLogin.exe" -Force
          }

      - name: Upload compiled exe
        uses: actions/upload-artifact@v4
        with:
          name: TapestryLogin-exe
          path: TapestryLogin.exe
